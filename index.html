<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lista de Presentes</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

 <link rel="stylesheet" href="css/style.css">

</head>

<body>
  <!-- IMAGENS TOPO -->
  <div class="topo">
    <img src="img/capa.png" alt="Capa">
    <img src="img/instrucoes.png" alt="Instruções">
  </div>
  <div class="container py-5">
    <h1 class="text-center mb-5">🎁 Lista de Presentes</h1>

    <div id="lista-presentes" class="row"></div>
  </div>

  <script>

    const URL_PLANILHA = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQVGMb35mntDTqq8xaxV5HkTrRT-gCVgMVxL4SKsJXbh1ePzSxlAx2PRPVY1y7q1XORxiYE5VCHVY8y/pub?gid=481347329&single=true&output=csv";
    const chavePix = "175.177.817-74";

    function limparTexto(valor) {
      return String(valor || "")
        .replace(/^"|"$/g, "")
        .replace(/\r/g, "")
        .trim();
    }

    function normalizarCabecalho(valor) {
      return limparTexto(valor)
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .toLowerCase()
        .replace(/\s+/g, " ")
        .trim();
    }
    function parseCSV(texto) {
      const linhas = [];
      let linha = [];
      let campo = "";
      let dentroAspas = false;

      for (let i = 0; i < texto.length; i++) {
        const char = texto[i];
        const proximo = texto[i + 1];

        if (char === '"' && dentroAspas && proximo === '"') {
          campo += '"';
          i++;
        } else if (char === '"') {
          dentroAspas = !dentroAspas;
        } else if (char === "," && !dentroAspas) {
          linha.push(campo);
          campo = "";
        } else if ((char === "\n" || char === "\r") && !dentroAspas) {
          if (campo || linha.length) {
            linha.push(campo);
            linhas.push(linha);
            linha = [];
            campo = "";
          }
        } else {
          campo += char;
        }
      }

      if (campo || linha.length) {
        linha.push(campo);
        linhas.push(linha);
      }

      return linhas;
    }

    function montarObjeto(cabecalhos, linha) {
      const item = {};

      cabecalhos.forEach((cabecalho, index) => {
        item[cabecalho] = limparTexto(linha[index]);
      });

      return item;
    }

    function ehSim(valor) {
      return ["sim", "s", "true", "1"].includes(
        limparTexto(valor).toLowerCase()
      );
    }

    function linkValido(link) {
      const valor = limparTexto(link);
      return valor && valor !== "—" && valor !== "-" && valor !== "#";
    }

    function corrigirCaminhoImagem(imagem) {
      let caminho = limparTexto(imagem);

      if (!caminho || caminho === "—" || caminho === "-") {
        return "img/sem-imagem.png";
      }

      caminho = caminho.replace(/^\/+/, "");

      if (!caminho.startsWith("img/")) {
        caminho = "img/" + caminho;
      }

      return encodeURI(caminho);
    }

    function getCampo(item, nomes) {
      for (const nome of nomes) {
        const chave = normalizarCabecalho(nome);
        if (item[chave] !== undefined) {
          return item[chave];
        }
      }
      return "";
    }

    async function carregarPresentes() {
      const separador = URL_PLANILHA.includes("?") ? "&" : "?";
      const urlSemCache = URL_PLANILHA + separador + "t=" + Date.now();

      const resposta = await fetch(urlSemCache, {
        cache: "no-store"
      });

      if (!resposta.ok) {
        throw new Error("Erro ao carregar planilha.");
      }

      const texto = await resposta.text();
      const linhas = parseCSV(texto).filter(linha =>
        linha.some(campo => limparTexto(campo) !== "")
      );

      const cabecalhos = linhas[0].map(normalizarCabecalho);

      console.log("Cabeçalhos encontrados:", cabecalhos);

      return linhas.slice(1)
        .map(linha => montarObjeto(cabecalhos, linha))
        .map(item => {
          const nome = getCampo(item, ["Item", "Nome"]);
          const imagem = getCampo(item, ["Imagem"]);
          const link = getCampo(item, ["Link"]);
          const valor = getCampo(item, ["Valor Unidade", "Valor"]);
          const status = getCampo(item, ["Status"]);
          const ativo = getCampo(item, ["Ativo"]) || "Sim";
          const brincadeira = getCampo(item, ["Brincadeira"]) || "Não";

          return {
            nome,
            imagem: corrigirCaminhoImagem(imagem),
            link,
            valor,
            status,
            ativo,
            brincadeira: ehSim(brincadeira)
          };
        })
        .filter(item => item.nome)
        .filter(item => ehSim(item.ativo));
    }

    function gerarCards(presentes) {
      const container = document.getElementById("lista-presentes");

      container.innerHTML = presentes.map(item => {
        const status = limparTexto(item.status).toLowerCase();
        const estaGanho = status.includes("ganhado");
        const possuiLink = linkValido(item.link);

        const pix = `
        <p class="pix">
          <strong>Pix:</strong> ${chavePix}
        </p>
      `;

        const seloStatus = estaGanho
          ? `<p class="text-success fw-bold mt-2">Presente já ganho</p>`
          : "";


        const deveMostrarPix = estaGanho || item.brincadeira;

        const botaoPix = deveMostrarPix
          ? `
    <p class="text-success fw-bold mt-2">
      Disponível via Pix
    </p>

    <button 
      class="btn btn-success"
      onclick="copiarPixCopiaCola('${item.valor}')">
      Copiar Pix com valor
    </button>
  `
          : "";

        const botaoPresentear = !item.brincadeira && possuiLink && !estaGanho
          ? `
          <a href="${item.link}" target="_blank" class="btn btn-primary">
            Presentear
          </a>
        `
          : "";

        return `
        <div class="col-md-4 mb-4">
          <div class="card h-100 shadow-sm ${estaGanho ? "border-success" : ""}">

            <img 
  src="${item.imagem}" 
  class="card-img-top" 
  alt="${item.nome}" 
  loading="lazy"
  onerror="this.onerror=null; this.src='img/sem-imagem.png';"
>

            <div class="card-body text-center">
              <h5 class="card-title">${item.nome}</h5>
<p class="card-text">${item.valor}</p>

              ${pix}
              ${seloStatus}
${botaoPix}
${!estaGanho && !item.brincadeira ? botaoPresentear : ""}
            </div>

          </div>
        </div>
      `;
      }).join("");
    }

    function valorParaPix(valorTexto) {
      return String(valorTexto || "")
        .replace("R$", "")
        .replace(/\./g, "")
        .replace(",", ".")
        .trim();
    }

    function crc16(payload) {
      let crc = 0xffff;

      for (let i = 0; i < payload.length; i++) {
        crc ^= payload.charCodeAt(i) << 8;

        for (let j = 0; j < 8; j++) {
          crc = crc & 0x8000 ? (crc << 1) ^ 0x1021 : crc << 1;
          crc &= 0xffff;
        }
      }

      return crc.toString(16).toUpperCase().padStart(4, "0");
    }

    const pixBaseSemValor = "00020126330014br.gov.bcb.pix0111175177817745204000053039865802BR5916LYGIA SCHUAMBACH6009Sao Paulo62290525REC6A15E6DE1FD7A94758020463040CBB";

    function gerarPixComValor(valorTexto) {
      const valor = valorParaPix(valorTexto);
      const pixSemCRC = pixBaseSemValor.substring(0, pixBaseSemValor.length - 8);
      const campoValor = "54" + valor.length.toString().padStart(2, "0") + valor;
      const posMoeda = pixSemCRC.indexOf("5303986") + "5303986".length;

      const payloadSemCRC =
        pixSemCRC.substring(0, posMoeda) +
        campoValor +
        pixSemCRC.substring(posMoeda) +
        "6304";

      return payloadSemCRC + crc16(payloadSemCRC);
    }

    function copiarPixCopiaCola(valor) {
      const pix = gerarPixComValor(valor);

      navigator.clipboard.writeText(pix).then(() => {
        alert(`Pix copia e cola de ${valor} copiado! Abra seu banco, escolha Pix copia e cola e cole o código.`);
      });
    }

    async function iniciar() {
      try {
        const presentes = await carregarPresentes();
        gerarCards(presentes);
      } catch (erro) {
        console.error(erro);
        document.getElementById("lista-presentes").innerHTML = `
        <div class="col-12 text-center">
          <p class="text-danger fw-bold">Erro ao carregar a lista de presentes.</p>
        </div>
      `;
      }
    }

    iniciar();
  </script>

  <!-- IMAGENS rodapé agradecimento -->
  <div class="topo">
    <img src="img/agradecimento.png" alt="agradecimento">

  </div>
</body>

</html>
